name: Build Windows EXE

# Surum yayinlandiginda (veya elle tetiklendiginde) Windows .exe olusturur
# ve surume ekler.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: EXE olustur
        run: pyinstaller vpn_kontrol.spec --noconfirm --clean

      - name: EXE'yi surume ekle
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VPN_Kontrol.exe
